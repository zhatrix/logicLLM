[project]
name = "logicllm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.28.0",
    "mlx-lm>=0.31.3",
    "numpy>=2.5.2",
    "openai>=3.3.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.0.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logicllm"]
